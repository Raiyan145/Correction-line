<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Line Fixer AI</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <h1>✨ Line Fixer AI</h1>
  <p class="sub">Bangla • Banglish • English — fix your line in any vibe</p>

  <details class="card" id="keybox">
    <summary>🔑 Gemini API Key (saved only in your browser)</summary>
    <input id="apiKey" type="password" placeholder="Paste Gemini API key">
    <input id="model" type="text" value="gemini-2.5-flash" placeholder="Model">
    <button id="saveKey" class="small">Save</button>
  </details>

  <div class="card">
    <textarea id="input" rows="4" placeholder="Type your line here... (ami kal jabo na tumi ki ashba?)"></textarea>

    <div class="label">Styles</div>
    <div id="styles" class="chips"></div>

    <div class="label">Output language</div>
    <select id="lang">
      <option value="same">Same as my input</option>
      <option value="English">English</option>
      <option value="Bangla">বাংলা (Bangla script)</option>
      <option value="Banglish">Banglish (Bangla in English letters)</option>
    </select>

    <button id="go">Correct it 🚀</button>
  </div>

  <div id="out"></div>
</main>
<script src="script.js"></script>
</body>
</html>
